<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <h2 class="text-center text-success">📊 Tumor Statistics Dashboard</h2>

    <div class="row mt-4">
        <div class="col-md-6">
            <div class="card p-3 shadow">
                <h5 class="text-center">Tumor Distribution</h5>
                <img src="{{ tumor_chart }}" class="img-fluid">
            </div>
        </div>

        <div class="col-md-6">
            <div class="card p-3 shadow">
                <h5 class="text-center">Gender Distribution</h5>
                <img src="{{ gender_chart }}" class="img-fluid">
            </div>
        </div>
    </div>

    <div class="text-center mt-4">
        <a href="/" class="btn btn-primary">Home</a>
        <a href="/admin" class="btn btn-warning">Admin Panel</a>
        <a href="/logout" class="btn btn-danger">Logout</a>
    </div>
</div>

</body>
</html>
