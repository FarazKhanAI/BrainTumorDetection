<!DOCTYPE html>
<html lang="en">
<head>
    <title>Brain Tumor Detection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-lg p-4">
        <h2 class="text-center text-primary mb-4">🧠 Brain Tumor Detection System</h2>

        <form method="POST" enctype="multipart/form-data">
            <div class="row mb-3">
                <div class="col">
                    <input class="form-control" name="patient_name" placeholder="Patient Name" required>
                </div>
                <div class="col">
                    <input class="form-control" name="age" type="number" placeholder="Age" required>
                </div>
                <div class="col">
                    <select class="form-control" name="gender" required>
                        <option value="">Gender</option>
                        <option>Male</option>
                        <option>Female</option>
                    </select>
                </div>
            </div>

            <input class="form-control mb-3" type="file" name="file" multiple required>

            <button class="btn btn-success w-100">Analyze MRI</button>
        </form>
    </div>
</div>

</body>
</html>
